<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wife</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="./assets/audio/WhenTheMoon'sReachingOutStars.mp3" as="audio">

    <audio id="hovering" preload="auto" src="./assets/audio/deck_ui_navigation.wav"></audio>

    </audio>
    <div id="all">
        <video class="fullscreen" autoplay preload="auto" id="intro"></video>

        <section>
            <nav class="start " id="main_menu">
                <ul class="nav fade-in">
                    <li>
                        <h2 class="menu1">
                            <span class="backrect"></span>
                            <span class="secbackrect"></span>
                            <span class="text base">SKILLS</span>
                            <span class="text overlay">SKILLS</span>
                        </h2>
                    </li>
                    <li>
                        <h2 class="menu2">
                            <span class="backrect"></span>

                    <li>

                            <span class="backrect"></span>

                        </h2>
                    </li>
                    <li>
                        <h2 class="menu4">
                            <span class="backrect"></span>
                            <span class="secbackrect"></span>
                            <span class="text base">GITHUB</span>
                            <span class="text overlay">GITHUB</span>
                        </h2>
                    </li>
                    <li>
                        <h2 class="menu5">
                            <span class="backrect"></span>
                            <span class="secbackrect"></span>
                            <span class="text base">ABOUT ME</span>
                            <span class="text overlay">ABOUT ME</span>
                        </h2>
                    </li>
                </ul>
            </nav>
        </section>

        <section class="screen hidden" id="skills-menu">
            <div>
                <div class="container-skills">
                    <h1>Back</h1>
                    <div class="skill-cards">
                        <div class="cardc">
                            <img class="card" src="./assets/cards/arcana_hunger.jpg">
                        </div>
                        <div class="cardc">
                            <img class="card" src="./assets/cards/arcana_judgement.jpg">
                        </div>
                        <div class="cardc">
                            <img class="card" src="./assets/cards/arcana_strength.jpg">
                        </div>
                        <div class="cardc">
                            <img class="card" src="./assets/cards/arcana_thechariot.png">
                        </div>
                        
                    </div>
                </div>
            </div>
        </section>
        <section class="screen hidden" id="projects-menu"></section>
        <section class="screen hidden" id="contact-menu"></section>
        <section class="screen hidden" id="about-menu"></section>

    <script src="script.js"></script>

</html>
